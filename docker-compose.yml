services:
  postgres:
    image: postgres:18-alpine
    container_name: field_scheduler_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: field_scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped

  parser-service:
    build:
      context: ./data-processing-service
      dockerfile: Dockerfile
    container_name: field_scheduler_parser
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata: